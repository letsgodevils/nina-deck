<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Switch</title>
<style>
	body { font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; background: #2d2d2d; color: #d8d8d8; margin: 0; padding: 12px; }
	label { display: block; margin-bottom: 6px; color: #9a9a9a; }
	select, input, button { width: 100%; box-sizing: border-box; padding: 6px 8px; font-size: 13px; color: #e8e8e8; background: #3d3d3d; border: 1px solid #555; border-radius: 4px; }
	button { margin-top: 10px; cursor: pointer; }
	button:hover { background: #484848; }
	#valuerow { display: none; margin-top: 10px; }
	.hint { margin-top: 10px; color: #9a9a9a; line-height: 1.4; }
</style>
</head>
<body>
	<label for="switch">Switch for this key</label>
	<select id="switch"></select>
	<div id="valuerow">
		<label for="value">Value to set when pressed</label>
		<input id="value" type="number" step="any" />
	</div>
	<button id="refresh" type="button">Refresh list from N.I.N.A.</button>
	<div class="hint" id="hint"></div>
	<script src="switch.js"></script>
</body>
</html>
